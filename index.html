<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create strong, random passwords instantly." />
    <title>Pass Generator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="generator" aria-labelledby="title">
        <p class="eyebrow">Password generator</p>
        <h1 id="title">Create a secure password</h1>

        <div class="password-box">
          <input
            id="password"
            type="text"
            aria-label="Generated password"
            readonly
            spellcheck="false"
          />
          <button id="copy" class="icon-button" type="button" aria-label="Copy password">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3M5 8h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z" />
            </svg>
          </button>
        </div>
        <p id="copy-status" class="copy-status" aria-live="polite"></p>

        <div class="controls">
          <div class="range-heading">
            <label for="length">Password length</label>
            <output id="length-value" for="length">16</output>
          </div>
          <input id="length" type="range" min="4" max="64" value="16" />

          <fieldset>
            <legend>Include</legend>
            <label class="option">
              <span>Uppercase</span>
              <input id="uppercase" type="checkbox" checked />
              <span class="toggle" aria-hidden="true"></span>
            </label>
            <label class="option">
              <span>Lowercase</span>
              <input id="lowercase" type="checkbox" checked />
              <span class="toggle" aria-hidden="true"></span>
            </label>
            <label class="option">
              <span>Numbers</span>
              <input id="numbers" type="checkbox" checked />
              <span class="toggle" aria-hidden="true"></span>
            </label>
            <label class="option">
              <span>Symbols</span>
              <input id="symbols" type="checkbox" checked />
              <span class="toggle" aria-hidden="true"></span>
            </label>
          </fieldset>

          <button id="generate" class="generate-button" type="button">
            Generate password
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
