<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="hero">
            <h1>Generate a <span class="high"> random password </span></h1>
            <h3 class="p-hero"> Never use an insecure password again.</h3>
            <button class="btn" onclick="givePasswords()">Generate passwords</button>
        </div>
        
        <div class="settings">
            <label for="char-count">Longitud:</label>
            <input type="number" id="char-count" value="10" min="4" max="20">
        </div>
        
        <div class="line">
            <hr>
        </div>
        
        <div class="pass-display">
            <div class="display" id="firstPass"></div>
            <div class="display" id="secondPass"></div>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
